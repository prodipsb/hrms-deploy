services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
       PGADMIN_DEFAULT_EMAIL: admin@genexinfosys.com
       PGADMIN_DEFAULT_PASSWORD: hr@genex
    ports:
      - "5050:80"
    depends_on:
      - postgres

  fastapi:
    build: ../hrms-backend
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      SECRET_KEY: ${JWT_SECRET}
    depends_on:
      - postgres

  nextjs:
    build:
      context: ../hrms-next
      args:
        NEXT_PUBLIC_NET_URL: http://fastapi:8000
    environment:
      NEXT_PUBLIC_NET_URL: http://fastapi:8000
      JWT_SECRET: ${JWT_SECRET} 
      NODE_ENV: production
    depends_on:
      - fastapi
    ports:
      - "3000:3000"

volumes:
  pgdata:
